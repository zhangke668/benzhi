<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:750px;background:#f4f2ee;font-family:"Noto Serif CJK SC",serif;color:#1f1f1f}
.card{margin:40px;background:#fff;padding:64px 56px 48px;border-radius:6px;box-shadow:0 2px 20px rgba(0,0,0,.05)}
.label{font-family:"Noto Sans CJK SC",sans-serif;font-size:15px;letter-spacing:4px;color:#9a948a;margin-bottom:16px}
.origin{font-size:24px;line-height:1.7;color:#555;border-left:3px solid #d9d4cb;padding-left:20px;margin-bottom:52px}
.steps{position:relative;margin-bottom:52px;padding-left:28px}
.steps:before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:1px;background:#ddd7cd}
.step{position:relative;font-size:21px;line-height:1.7;color:#444;margin-bottom:26px}
.step:before{content:"";position:absolute;left:-27px;top:12px;width:11px;height:11px;border-radius:50%;background:#fff;border:1.5px solid #b8b0a3}
.step:last-child{margin-bottom:0}
.final{background:#faf8f4;padding:36px 32px;border-radius:4px;margin-bottom:56px}
.essence{font-size:30px;font-weight:700;line-height:1.6;margin-bottom:28px}
.term{font-size:19px;line-height:1.7;color:#6b6358}
.term b{color:#1f1f1f;font-weight:700}
.foot{display:flex;justify-content:space-between;font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;letter-spacing:2px;color:#aaa39a;border-top:1px solid #eee9e1;padding-top:22px}
</style></head><body><div class="card">
<div class="label">起 点</div>
<div class="origin">所有的恐惧，都来源于我总幻想别人会欺负我，或者我没有被好好对待。</div>
<div class="label">演 化</div>
<div class="steps">
<div class="step">恐惧不是来自别人，是经历过的事被迁移、投射到了未来。</div>
<div class="step">焦虑不在事情里，在“现在”和“那时”之间的空隙里。</div>
<div class="step">预设控制不了，应对才是自己能握住的。</div>
</div>
<div class="label">落 点</div>
<div class="final">
<div class="essence">你没有押注“我能赢”，<br>你只是不再替未来的自己做决定。</div>
<div class="term">它成全你的叫：<br><b>信任未来自我的判断力，从而释放当下的认知负荷。</b></div>
</div>
<div class="foot"><span>2026.10.17</span><span>本质 · skill</span></div>
</div></body></html>
